<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
      min-width: 300px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      margin-top: 12px;
      padding: 6px 16px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      background: #6d28d9;
    }
    button.secondary {
      background: #e5e7eb;
      color: #333;
    }
    button.secondary:hover {
      background: #d1d5db;
    }
  </style>
</head>
<body>
  <label for="baseUrl">Docreview URL</label>
  <input type="url" id="baseUrl" placeholder="http://localhost:3000">
  <div style="margin-top:12px;display:flex;gap:8px;">
    <button id="save">Save</button>
    <button id="cancel" class="secondary">Cancel</button>
  </div>
  <script src="defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>
