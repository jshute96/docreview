<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docreview Help</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #27272a;
      padding: 1.5rem 2rem;
      max-width: 800px;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1rem; color: #18181b; }
    h2 { font-size: 1.2rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.5rem; color: #27272a; }
    h3 { font-size: 1.05rem; font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.4rem; color: #3f3f46; }
    p { margin-bottom: 0.75rem; }
    ul, ol { margin-bottom: 0.75rem; padding-left: 1.5rem; }
    li { margin-bottom: 0.25rem; }
    code {
      background: #f4f4f5;
      border-radius: 3px;
      padding: 0.15em 0.35em;
      font-size: 0.9em;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    }
    pre {
      background: #f4f4f5;
      border-radius: 6px;
      padding: 1rem;
      overflow-x: auto;
      margin-bottom: 0.75rem;
    }
    pre code { background: none; padding: 0; }
    a { color: #7c3aed; text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; height: auto; border-radius: 6px; margin: 0.5rem 0; }
    blockquote {
      border-left: 3px solid #d4d4d8;
      padding-left: 1rem;
      color: #52525b;
      margin-bottom: 0.75rem;
    }
    table { border-collapse: collapse; margin-bottom: 0.75rem; width: 100%; }
    th, td { border: 1px solid #e4e4e7; padding: 0.4rem 0.75rem; text-align: left; }
    th { background: #f4f4f5; font-weight: 600; }
    hr { border: none; border-top: 1px solid #e4e4e7; margin: 1.5rem 0; }
    .error { color: #dc2626; padding: 2rem; text-align: center; }
  </style>
</head>
<body>
  <div id="content"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const page = params.get("page") || "quick-start";

    fetch(`/help/${page}.md`)
      .then(res => {
        if (!res.ok) throw new Error(`Page not found: ${page}`);
        return res.text();
      })
      .then(md => {
        document.getElementById("content").innerHTML = marked.parse(md);
      })
      .catch(err => {
        document.getElementById("content").innerHTML =
          `<div class="error">${err.message}</div>`;
      });

    // Forward navigation keys to parent dialog
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "Escape" || e.key === "Enter") {
        window.parent.postMessage({ type: "help-key", key: e.key }, "*");
      }
    });
  </script>
</body>
</html>
